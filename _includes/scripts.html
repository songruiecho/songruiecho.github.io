<script src="assets/js/main.min.js"></script>
<script>
  (function () {
    var toggle = document.querySelector("[data-language-toggle]");
    var label = document.querySelector("[data-language-label]");
    var storageKey = "homepage-language";

    function applyLanguage(language) {
      var isChinese = language === "zh";
      document.body.classList.toggle("lang-zh", isChinese);
      document.documentElement.lang = isChinese ? "zh-CN" : "en";
      if (label) {
        label.textContent = isChinese ? "English" : "中文";
      }
      try {
        window.localStorage.setItem(storageKey, language);
      } catch (error) {}
    }

    if (toggle) {
      var initialLanguage = "en";
      try {
        initialLanguage = window.localStorage.getItem(storageKey) || initialLanguage;
      } catch (error) {}
      applyLanguage(initialLanguage);
      var switchLanguage = function () {
        applyLanguage(document.body.classList.contains("lang-zh") ? "en" : "zh");
      };
      toggle.addEventListener("click", switchLanguage);
      toggle.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          switchLanguage();
        }
      });
    }

    document.querySelectorAll("[data-expand-list]").forEach(function (list) {
      var moreButton = list.querySelector("[data-expand-more]");
      var collapseButton = list.querySelector("[data-expand-collapse]");
      var hiddenItems = Array.prototype.slice.call(list.querySelectorAll("[data-expand-item]"));
      var step = parseInt(list.getAttribute("data-step"), 10) || 3;

      function updateControls() {
        var remaining = hiddenItems.filter(function (item) {
          return item.classList.contains("is-hidden");
        });
        if (moreButton) {
          moreButton.classList.toggle("is-hidden", remaining.length === 0);
        }
        if (collapseButton) {
          collapseButton.classList.toggle("is-hidden", remaining.length === hiddenItems.length);
        }
      }

      if (moreButton) {
        moreButton.addEventListener("click", function () {
          hiddenItems
            .filter(function (item) { return item.classList.contains("is-hidden"); })
            .slice(0, step)
            .forEach(function (item) { item.classList.remove("is-hidden"); });
          updateControls();
        });
      }

      if (collapseButton) {
        collapseButton.addEventListener("click", function () {
          hiddenItems.forEach(function (item) { item.classList.add("is-hidden"); });
          updateControls();
        });
      }

      updateControls();
    });
  }());
</script>
