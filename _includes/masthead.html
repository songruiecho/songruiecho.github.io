<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
         <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item">
          <span class="language-toggle" data-language-toggle aria-label="Switch language" role="button" tabindex="0">
            <img class="svg" src="/images/en.svg" width="20pt">
            <span data-language-label>中文</span>
          </span>
        </li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">
              <span data-lang="en">{{ link.title_en | default: link.title }}</span>
              <span data-lang="zh">{{ link.title_zh | default: link.title }}</span>
            </a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
